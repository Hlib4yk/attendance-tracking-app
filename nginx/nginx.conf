events {
  worker_connections 1024;
}

http {
  upstream backend {
    server backend:3001;
  }

  upstream face {
    server face-service:8787;
  }

  server {
    listen 80;

    # Face service
    location /face/ {
      rewrite ^/face/(.*)$ /$1 break;
      proxy_pass http://face;
      proxy_set_header Host $host;
    }

    # Main backend — everything else
    location / {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Forward large uploads (classroom photos)
      client_max_body_size 50m;
    }
  }
}
